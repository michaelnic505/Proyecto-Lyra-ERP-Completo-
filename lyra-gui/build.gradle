plugins {
    id 'java'
    id 'application' // Añadir el plugin para permitir application {}
}

group = 'com.simplecore.erp'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':lyra-service') // Conectar GUI con el servidor
    implementation project(':lyra-shared')
    implementation 'com.miglayout:miglayout-swing:11.4.2'
    implementation 'com.kenai.nbpwr:org-jdesktop-animation-timing:1.0-201002281504'
    implementation 'com.toedter:jcalendar:1.4'
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.4'
    implementation 'com.formdev:flatlaf-extras:3.5.4'
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation files('libs/LyraComponents.jar')
    implementation files('libs/svgSalamander-1.1.4.jar')
    implementation 'net.sf.jasperreports:jasperreports:7.0.1'
    implementation 'net.java.dev.jna:jna-platform:4.0.0'
    implementation 'net.java.dev.jna:jna:5.16.0'
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'
    implementation("org.apache.logging.log4j:log4j-core:2.20.0")
    implementation("org.apache.logging.log4j:log4j-api:2.20.0")


}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion '2.20.0'
        }
    }
}


// Configuración de fuentes y recursos
sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
}

// Configuración de la tarea 'jar' y manifiesto
jar {
    archiveBaseName = 'Lyra GUI' // Define el nombre del archivo JAR
    archiveVersion = '1.0.0'  // Define la versión del archivo JAR
    destinationDirectory = file("$buildDir/libs") // Asegura que el archivo JAR se guarde en 'build/libs'

    manifest {
        attributes(
            'Main-Class': 'com.simplecore.erp.client.main.LyraClient' // Asegúrate de que este es el nombre correcto de la clase principal
        )
    }

    // Incluir las dependencias en el JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

}

// Evitar archivos duplicados en el JAR
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Configuración de la aplicación
application {
    mainClass = 'com.simplecore.erp.client.main.LyraClient' // Especifica la clase principal de la GUI
}
