plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.guava
    implementation 'com.zaxxer:HikariCP:6.2.1'
    implementation 'com.miglayout:miglayout-swing:11.4.2'
    implementation 'com.kenai.nbpwr:org-jdesktop-animation-timing:1.0-201002281504'
    implementation 'com.toedter:jcalendar:1.4'
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.4'
    implementation 'com.formdev:flatlaf-extras:3.5.4'
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation files('libs/LyraComponents.jar')
    implementation files('libs/svgSalamander-1.1.4.jar')
    implementation 'net.sf.jasperreports:jasperreports:7.0.1'
    implementation 'net.java.dev.jna:jna-platform:4.0.0'
    implementation 'net.java.dev.jna:jna:5.16.0'
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'com.mysql:mysql-connector-j:9.2.0'
}

application {
    mainClass.set('com.simplecore.erp.main.App')
}

// Configuración de fuentes y recursos
sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
}

tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // Ignorar archivos duplicados
}


